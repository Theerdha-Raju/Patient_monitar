<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="100%" height="100%" style="background:#0b0f19; font-family:'Segoe UI',system-ui,sans-serif;">
  <defs>
    <linearGradient id="espGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="sensorGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Title & Banner -->
  <text x="450" y="40" text-anchor="middle" fill="#f8fafc" font-size="22" font-weight="700" letter-spacing="1">COVID-19 QUARANTINE HEALTH MONITOR - HARDWARE INTERFACE</text>
  <text x="450" y="65" text-anchor="middle" fill="#94a3b8" font-size="13">ESP32-WROOM-32 Pinout &amp; Multi-Sensor Interface (I2C + 1-Wire)</text>

  <!-- ESP32 Module Block -->
  <rect x="310" y="110" width="280" height="350" rx="14" fill="url(#espGrad)" stroke="#38bdf8" stroke-width="2.5" />
  <rect x="360" y="125" width="180" height="110" rx="6" fill="#1e293b" stroke="#64748b" stroke-width="1.5" />
  <text x="450" y="170" text-anchor="middle" fill="#e2e8f0" font-size="14" font-weight="700">ESP-WROOM-32</text>
  <text x="450" y="195" text-anchor="middle" fill="#38bdf8" font-size="11">Wi-Fi + BLE SoC</text>
  <rect x="420" y="210" width="60" height="15" rx="3" fill="#0284c7" />
  <text x="450" y="221" text-anchor="middle" fill="#ffffff" font-size="9" font-weight="bold">ANTENNA</text>

  <!-- ESP32 Pin Labels Left -->
  <text x="325" y="280" fill="#94a3b8" font-size="12" font-family="monospace">3V3</text>
  <circle cx="310" cy="276" r="5" fill="#ef4444" />
  <text x="325" y="315" fill="#94a3b8" font-size="12" font-family="monospace">GND</text>
  <circle cx="310" cy="311" r="5" fill="#000000" stroke="#94a3b8" />
  <text x="325" y="350" fill="#94a3b8" font-size="12" font-family="monospace">GPIO 21 (SDA)</text>
  <circle cx="310" cy="346" r="5" fill="#00f2fe" />
  <text x="325" y="385" fill="#94a3b8" font-size="12" font-family="monospace">GPIO 22 (SCL)</text>
  <circle cx="310" cy="381" r="5" fill="#f59e0b" />

  <!-- ESP32 Pin Labels Right -->
  <text x="475" y="280" fill="#94a3b8" font-size="12" font-family="monospace">GPIO 4 (DATA)</text>
  <circle cx="590" cy="276" r="5" fill="#10b981" />
  <text x="475" y="315" fill="#94a3b8" font-size="12" font-family="monospace">GPIO 18 (BUZZER)</text>
  <circle cx="590" cy="311" r="5" fill="#a855f7" />
  <text x="475" y="350" fill="#94a3b8" font-size="12" font-family="monospace">GPIO 2 (TX LED)</text>
  <circle cx="590" cy="346" r="5" fill="#3b82f6" />
  <text x="515" y="385" fill="#94a3b8" font-size="12" font-family="monospace">GND</text>
  <circle cx="590" cy="381" r="5" fill="#000000" stroke="#94a3b8" />

  <!-- SENSOR 1: MAX30102 Pulse Oximeter (Left Side) -->
  <rect x="40" y="160" width="190" height="230" rx="10" fill="url(#sensorGrad)" stroke="#00f2fe" stroke-width="2" />
  <text x="135" y="195" text-anchor="middle" fill="#00f2fe" font-size="15" font-weight="700">MAX30102</text>
  <text x="135" y="215" text-anchor="middle" fill="#cbd5e1" font-size="11">Pulse Oximeter &amp; HR</text>

  <!-- Optical sensor window -->
  <rect x="100" y="230" width="70" height="40" rx="6" fill="#000000" stroke="#334155" />
  <circle cx="120" cy="250" r="7" fill="#ef4444" filter="url(#glow)" />
  <circle cx="150" cy="250" r="7" fill="#881337" />
  <text x="135" y="285" text-anchor="middle" fill="#94a3b8" font-size="9">IR + RED BIOSENSOR</text>

  <!-- MAX30102 Pins -->
  <circle cx="230" cy="276" r="5" fill="#ef4444" />
  <text x="215" y="280" text-anchor="end" fill="#94a3b8" font-size="11" font-family="monospace">VIN</text>
  <circle cx="230" cy="311" r="5" fill="#000000" stroke="#94a3b8" />
  <text x="215" y="315" text-anchor="end" fill="#94a3b8" font-size="11" font-family="monospace">GND</text>
  <circle cx="230" cy="346" r="5" fill="#00f2fe" />
  <text x="215" y="350" text-anchor="end" fill="#00f2fe" font-size="11" font-family="monospace">SDA</text>
  <circle cx="230" cy="381" r="5" fill="#f59e0b" />
  <text x="215" y="385" text-anchor="end" fill="#f59e0b" font-size="11" font-family="monospace">SCL</text>

  <!-- Wires Left Side -->
  <path d="M 230 276 L 310 276" stroke="#ef4444" stroke-width="2.5" fill="none" />
  <path d="M 230 311 L 310 311" stroke="#475569" stroke-width="2.5" stroke-dasharray="4 2" fill="none" />
  <path d="M 230 346 L 310 346" stroke="#00f2fe" stroke-width="2.5" fill="none" />
  <path d="M 230 381 L 310 381" stroke="#f59e0b" stroke-width="2.5" fill="none" />

  <!-- SENSOR 2: DS18B20 Temperature Sensor (Right Side) -->
  <rect x="670" y="160" width="190" height="150" rx="10" fill="url(#sensorGrad)" stroke="#10b981" stroke-width="2" />
  <text x="765" y="195" text-anchor="middle" fill="#10b981" font-size="15" font-weight="700">DS18B20</text>
  <text x="765" y="215" text-anchor="middle" fill="#cbd5e1" font-size="11">Digital Body Temp (1-Wire)</text>

  <!-- Sensor Probe Graphic -->
  <rect x="740" y="230" width="50" height="20" rx="4" fill="#334155" stroke="#64748b" />
  <text x="765" y="244" text-anchor="middle" fill="#34d399" font-size="10" font-weight="bold">PROBE</text>

  <!-- DS18B20 Pins -->
  <circle cx="670" cy="276" r="5" fill="#10b981" />
  <text x="685" y="280" fill="#10b981" font-size="11" font-family="monospace">DATA (DQ)</text>

  <!-- Pullup Resistor graphic for DS18B20 -->
  <rect x="625" y="235" width="20" height="10" fill="#f59e0b" rx="2" />
  <text x="635" y="230" text-anchor="middle" fill="#f59e0b" font-size="9" font-family="monospace">4.7kΩ</text>

  <!-- Wire from GPIO 4 to DS18B20 -->
  <path d="M 590 276 L 670 276" stroke="#10b981" stroke-width="2.5" fill="none" />

  <!-- SENSOR 3: Piezo Alarm Buzzer (Right Side Bottom) -->
  <rect x="670" y="340" width="190" height="110" rx="10" fill="url(#sensorGrad)" stroke="#a855f7" stroke-width="2" />
  <text x="765" y="375" text-anchor="middle" fill="#c084fc" font-size="15" font-weight="700">PIEZO BUZZER</text>
  <text x="765" y="395" text-anchor="middle" fill="#cbd5e1" font-size="11">Local Acoustic Alarm</text>

  <!-- Buzzer Pins -->
  <circle cx="670" cy="311" r="5" fill="#a855f7" />
  <path d="M 590 311 L 670 311" stroke="#a855f7" stroke-width="2.5" fill="none" />

  <!-- Footer note -->
  <text x="450" y="495" text-anchor="middle" fill="#64748b" font-size="11">Data Communication: HTTP REST POST &amp; JSON Over 802.11 b/g/n Wi-Fi</text>
</svg>
