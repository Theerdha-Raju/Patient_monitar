services:
  - type: web
    name: patient-monitor-backend
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: node server.js
    plan: free
    envVars:
      - key: PORT
        value: 5000
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: patient-monitor-db
          property: connectionString

  - type: web
    name: patient-monitor-dashboard
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    plan: free
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: patient-monitor-backend
          property: host

databases:
  - name: patient-monitor-db
    databaseName: patient_db
    user: patient_user
    plan: free
